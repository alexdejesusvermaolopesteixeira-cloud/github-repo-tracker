[project]
name = "github-repo-tracker"
version = "1.0.0"
description = "Workflow para acompanhar PRs do GitHub"
requires-python = ">=3.10"
dependencies = [
    "mistralai-workflows>=1.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]
